[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "captcha-ai-solver"
version = "0.1.0"
description = "Public-only zero-shot street-grid benchmark participant"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
test = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
ai-solver = "ai_solver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: opt-in public HTTP checks; no model calls"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
